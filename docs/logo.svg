    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
